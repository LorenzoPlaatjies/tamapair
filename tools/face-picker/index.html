<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Picker</title>
<style>
  :root {
    --bg: #101014; --card: #1b1b22; --line: #2c2c36; --text: #f3f1ec; --muted: #9a98a3;
    --lo: #6fd3ff; --sm: #ff8fc7; --both: #ffd166; --screen: #000;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 16px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .2px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .label { color: var(--muted); font-size: 13px; margin-right: 2px; }
  button.chip { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
  button.chip.on { border-color: currentColor; }
  button.chip.lo.on { color: var(--lo); } button.chip.sm.on { color: var(--sm); }
  button.chip.opt.on { color: var(--both); }
  .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: -2px; margin-right: 6px; }
  main { padding: 18px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px;
    cursor: pointer; position: relative; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-2px); }
  .card.mine { border-color: var(--me); }
  .card.both { border-color: var(--both); box-shadow: 0 0 0 2px color-mix(in srgb, var(--both) 35%, transparent); }
  .screen { background: var(--screen); border-radius: 12px; aspect-ratio: 4/3; display: grid; place-items: center; overflow: hidden; }
  .screen svg { width: 100%; height: 100%; }
  .screen canvas { width: 100%; height: 100%; image-rendering: pixelated; animation: hop 2.4s steps(1) infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4%); } }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .name { font-weight: 600; }
  .dots { display: flex; gap: 4px; }
  .dot { font-size: 12px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .dot.lo { color: var(--lo); border-color: var(--lo); } .dot.sm { color: var(--sm); border-color: var(--sm); }
  .badge { position: absolute; top: -8px; right: -6px; background: var(--both); color: #222; font-size: 12px;
    font-weight: 700; padding: 2px 8px; border-radius: 999px; display: none; }
  .card.both .badge { display: block; }
  .summary { margin-top: 26px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
  .summary b { color: var(--both); }
  /* animation */
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  .face { animation: bob 2.6s ease-in-out infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .noblink .eyes { animation: none; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Pick our faces 🍡</h1>
  <p class="sub">Tap who you are, then tap the faces you love. Gold = you both picked it.</p>
  <div class="row" style="margin-bottom:8px">
    <span class="label">I am</span>
    <button class="chip lo" data-who="Lorenzo">Lorenzo</button>
    <button class="chip sm" data-who="Dr. Smith">Dr. Smith</button>
  </div>
  <div class="row" style="margin-bottom:8px">
    <span class="label">Style</span>
    <button class="chip opt" data-style="retro">retro pixel</button>
    <button class="chip opt" data-style="smooth">smooth</button>
  </div>
  <div class="row">
    <span class="label">Blush</span>
    <button class="chip opt" data-blush="on">on</button>
    <button class="chip opt" data-blush="off">off</button>
    <span class="label" style="margin-left:10px">Eyes</span>
    <button class="chip opt" data-eye="#ffffff"><span class="sw" style="background:#fff"></span>white</button>
    <button class="chip opt" data-eye="#9ff3e1"><span class="sw" style="background:#9ff3e1"></span>mint</button>
    <button class="chip opt" data-eye="#ffc2dc"><span class="sw" style="background:#ffc2dc"></span>pink</button>
    <button class="chip opt" data-eye="#ffe08a"><span class="sw" style="background:#ffe08a"></span>honey</button>
  </div>
</div></header>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="summary" id="summary"></div>
</div></main>

<script>
// ---------- face parts (all drawn by us, mochi *style*) ----------
const W = 240, H = 180, LX = 82, RX = 158, EY = 78;

function eye(type, x, c) {
  switch (type) {
    case 'round':  return `<rect x="${x-17}" y="${EY-26}" width="34" height="52" rx="16" fill="${c}"/>`;
    case 'big':    return `<rect x="${x-21}" y="${EY-30}" width="42" height="60" rx="20" fill="${c}"/><circle cx="${x+7}" cy="${EY-12}" r="7" fill="#000"/>`;
    case 'happy':  return `<path d="M${x-18} ${EY+8} Q${x} ${EY-22} ${x+18} ${EY+8}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    case 'closed': return `<path d="M${x-18} ${EY} Q${x} ${EY+14} ${x+18} ${EY}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    case 'flat':   return `<rect x="${x-20}" y="${EY-4}" width="40" height="9" rx="4" fill="${c}"/>`;
    case 'half':   return `<path d="M${x-17} ${EY} h34 v8 a16 16 0 0 1 -16 16 h-2 a16 16 0 0 1 -16 -16z" fill="${c}"/>`;
    case 'heart':  return `<path d="M${x} ${EY+22} C${x-34} ${EY} ${x-20} ${EY-28} ${x} ${EY-10} C${x+20} ${EY-28} ${x+34} ${EY} ${x} ${EY+22}z" fill="#ff5c8a"/>`;
    case 'star':   { let p=[]; for (let i=0;i<10;i++){const r=i%2?9:22,a=-Math.PI/2+i*Math.PI/5;p.push((x+r*Math.cos(a)).toFixed(1)+','+(EY+r*Math.sin(a)).toFixed(1));}
                     return `<polygon points="${p.join(' ')}" fill="#ffd166"/>`; }
    case 'spiral': return `<path d="M${x} ${EY} m-2 0 a2 2 0 1 1 4 0 a6 6 0 1 1 -12 0 a10 10 0 1 1 20 0 a14 14 0 1 1 -28 0 a18 18 0 1 1 36 0" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    case 'x':      return `<path d="M${x-14} ${EY-14} L${x+14} ${EY+14} M${x+14} ${EY-14} L${x-14} ${EY+14}" stroke="${c}" stroke-width="8" stroke-linecap="round"/>`;
    case 'angryL': return `<path d="M${x-17} ${EY-14} L${x+17} ${EY-2} V${EY+16} a10 10 0 0 1 -10 10 h-14 a10 10 0 0 1 -10 -10z" fill="${c}"/>`;
    case 'angryR': return `<path d="M${x+17} ${EY-14} L${x-17} ${EY-2} V${EY+16} a10 10 0 0 0 10 10 h14 a10 10 0 0 0 10 -10z" fill="${c}"/>`;
    case 'sadL':   return `<path d="M${x-17} ${EY-4} L${x+17} ${EY-18} V${EY+16} a10 10 0 0 1 -10 10 h-14 a10 10 0 0 1 -10 -10z" fill="${c}"/>`;
    case 'sadR':   return `<path d="M${x+17} ${EY-4} L${x-17} ${EY-18} V${EY+16} a10 10 0 0 0 10 10 h14 a10 10 0 0 0 10 -10z" fill="${c}"/>`;
    case 'side':   return `<rect x="${x-17}" y="${EY-26}" width="34" height="52" rx="16" fill="${c}"/><rect x="${x+1}" y="${EY-14}" width="12" height="22" rx="6" fill="#000"/>`;
    case 'tear':   return eye('round', x, c) + `<path d="M${x+12} ${EY+30} q6 10 0 16 q-6 -6 0 -16z" fill="#7cc7ff"/>`;
    case 'wink':   return eye('happy', x, c);
  }
  return '';
}
function mouth(type, c) {
  const y = 132, x = 120;
  switch (type) {
    case 'smile':  return `<path d="M${x-12} ${y} Q${x} ${y+12} ${x+12} ${y}" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    case 'big':    return `<path d="M${x-18} ${y-4} Q${x} ${y+24} ${x+18} ${y-4}z" fill="${c}"/>`;
    case 'o':      return `<ellipse cx="${x}" cy="${y+2}" rx="9" ry="11" fill="${c}"/>`;
    case 'small':  return `<rect x="${x-6}" y="${y}" width="12" height="5" rx="2.5" fill="${c}"/>`;
    case 'flat':   return `<rect x="${x-14}" y="${y}" width="28" height="6" rx="3" fill="${c}"/>`;
    case 'frown':  return `<path d="M${x-12} ${y+8} Q${x} ${y-4} ${x+12} ${y+8}" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    case 'cat':    return `<path d="M${x-14} ${y} q7 9 14 0 q7 9 14 0" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    case 'wavy':   return `<path d="M${x-18} ${y+3} q4.5 -7 9 0 t9 0 t9 0 t9 0" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    case 'tongue': return `<path d="M${x-14} ${y} Q${x} ${y+10} ${x+14} ${y}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${x-3} ${y+5} h12 v6 a6 6 0 0 1 -12 0z" fill="#ff7aa2"/>`;
    case 'drool':  return mouth('o', c) + `<path d="M${x+8} ${y+10} q4 10 0 16 q-4 -6 0 -16z" fill="#7cc7ff"/>`;
    case 'chew':   return `<rect x="${x-12}" y="${y-2}" width="24" height="10" rx="5" fill="${c}"/>`;
    case 'teeth':  return `<rect x="${x-16}" y="${y-4}" width="32" height="13" rx="4" fill="${c}"/><path d="M${x-16} ${y+2.5} h32" stroke="#000" stroke-width="2"/>`;
  }
  return '';
}
function extras(type) {
  const n = (x, y, s=1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 v-14 l10 -3 v14" stroke="#ffd166" stroke-width="3" fill="none"/><circle cx="-2" cy="0" r="4" fill="#ffd166"/><circle cx="8" cy="-3" r="4" fill="#ffd166"/></g>`;
  switch (type) {
    case 'zzz':   return `<text x="196" y="44" fill="#9a98a3" font-size="20" font-weight="700" font-family="system-ui">z</text><text x="210" y="28" fill="#9a98a3" font-size="14" font-weight="700" font-family="system-ui">z</text>`;
    case 'notes': return n(26, 52, .9) + n(206, 40, .8);
    case 'sweat': return `<path d="M200 40 q8 12 0 20 q-8 -8 0 -20z" fill="#7cc7ff"/>`;
    case 'vein':  return `<path d="M196 30 l8 8 m0 -8 l-8 8 m14 -4 l8 8 m0 -8 l-8 8" stroke="#ff5c5c" stroke-width="3" stroke-linecap="round"/>`;
    case 'q':     return `<text x="196" y="46" fill="#ffd166" font-size="28" font-weight="800" font-family="system-ui">?</text>`;
    case 'spark': return `<path d="M30 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z M205 120 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#ffd166"/>`;
    case 'crumbs':return `<circle cx="150" cy="150" r="3" fill="#d9a15b"/><circle cx="160" cy="142" r="2.5" fill="#d9a15b"/><circle cx="92" cy="152" r="2" fill="#d9a15b"/>`;
  }
  return '';
}

const FACES = [
  { id: 'idle',      name: 'Idle',       eyes: ['round','round'],   mouth: 'small' },
  { id: 'happy',     name: 'Happy',      eyes: ['happy','happy'],   mouth: 'smile' },
  { id: 'giggle',    name: 'Giggle',     eyes: ['happy','happy'],   mouth: 'big',   blushPlus: true },
  { id: 'love',      name: 'In love',    eyes: ['heart','heart'],   mouth: 'cat' },
  { id: 'excited',   name: 'Excited',    eyes: ['star','star'],     mouth: 'big',   extra: 'spark' },
  { id: 'wink',      name: 'Wink',       eyes: ['round','wink'],    mouth: 'tongue' },
  { id: 'shy',       name: 'Shy',        eyes: ['side','side'],     mouth: 'wavy',  blushPlus: true },
  { id: 'surprised', name: 'Surprised',  eyes: ['big','big'],       mouth: 'o' },
  { id: 'sleepy',    name: 'Sleepy',     eyes: ['half','half'],     mouth: 'small', extra: 'zzz' },
  { id: 'asleep',    name: 'Asleep',     eyes: ['closed','closed'], mouth: 'small', extra: 'zzz', noblink: true },
  { id: 'hungry',    name: 'Hungry',     eyes: ['big','big'],       mouth: 'drool' },
  { id: 'eating',    name: 'Munching',   eyes: ['closed','closed'], mouth: 'chew',  extra: 'crumbs', noblink: true },
  { id: 'jam',       name: 'Jamming',    eyes: ['closed','closed'], mouth: 'smile', extra: 'notes', noblink: true },
  { id: 'dizzy',     name: 'Dizzy',      eyes: ['spiral','spiral'], mouth: 'wavy',  noblink: true },
  { id: 'sad',       name: 'Sad',        eyes: ['sadL','sadR'],     mouth: 'frown' },
  { id: 'crying',    name: 'Crying',     eyes: ['tear','tear'],     mouth: 'frown' },
  { id: 'angry',     name: 'Grumpy',     eyes: ['angryL','angryR'], mouth: 'teeth', extra: 'vein' },
  { id: 'bored',     name: 'Bored',      eyes: ['flat','flat'],     mouth: 'flat' },
  { id: 'confused',  name: 'Confused',   eyes: ['round','half'],    mouth: 'wavy',  extra: 'q' },
  { id: 'nervous',   name: 'Nervous',    eyes: ['round','round'],   mouth: 'wavy',  extra: 'sweat' },
];

function faceSVG(f, opt, blink) {
  const c = opt.eye;
  const blushOn = opt.blush === 'on' || f.blushPlus;
  const bc = opt.style === 'retro' ? '#ff6f9f' : '#ff6f9f';
  const op = opt.style === 'retro' ? 1 : (f.blushPlus ? 0.75 : 0.5);
  const blush = blushOn ? `<ellipse cx="${LX-14}" cy="118" rx="16" ry="8" fill="${bc}" opacity="${op}"/><ellipse cx="${RX+14}" cy="118" rx="16" ry="8" fill="${bc}" opacity="${op}"/>` : '';
  const eyes = blink && !f.noblink
    ? `<g transform="translate(0 ${EY}) scale(1 0.12) translate(0 ${-EY})">${eye(f.eyes[0], LX, c)}${eye(f.eyes[1], RX, c)}</g>`
    : `<g class="eyes">${eye(f.eyes[0], LX, c)}${eye(f.eyes[1], RX, c)}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="${f.noblink?'noblink':''}"><g class="face">${blush}${eyes}${mouth(f.mouth, c)}${extras(f.extra)}</g></svg>`;
}

// Retro: draw the face on a tiny 60x45 grid, snap every pixel on/off, then blow it up.
const PX_W = 60, PX_H = 45;
function pixelate(svg, canvas) {
  const img = new Image();
  img.onload = () => {
    const lo = document.createElement('canvas'); lo.width = PX_W; lo.height = PX_H;
    const lc = lo.getContext('2d'); lc.drawImage(img, 0, 0, PX_W, PX_H);
    const d = lc.getImageData(0, 0, PX_W, PX_H), a = d.data;
    for (let i = 0; i < a.length; i += 4) {
      if (a[i+3] > 90) { a[i] = (a[i] >> 5) << 5 | 31; a[i+1] = (a[i+1] >> 5) << 5 | 31; a[i+2] = (a[i+2] >> 5) << 5 | 31; a[i+3] = 255; }
      else a[i+3] = 0;
    }
    lc.putImageData(d, 0, 0);
    const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(lo, 0, 0, canvas.width, canvas.height);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function paintRetro() {
  document.querySelectorAll('canvas[data-px]').forEach(cv => {
    const f = FACES.find(x => x.id === cv.dataset.px); pixelate(faceSVG(f, myOpt(), false), cv);
  });
}
// retro blink: each face blinks on its own little clock
setInterval(() => {
  if (myOpt().style !== 'retro') return;
  document.querySelectorAll('canvas[data-px]').forEach(cv => {
    if (Math.random() > 0.12) return;
    const f = FACES.find(x => x.id === cv.dataset.px), o = myOpt();
    pixelate(faceSVG(f, o, true), cv);
    setTimeout(() => pixelate(faceSVG(f, o, false), cv), 160);
  });
}, 500);

// ---------- shared state ----------
let state = { people: { 'Lorenzo': { faces: [], blush: 'on', eye: '#ffffff' }, 'Dr. Smith': { faces: [], blush: 'on', eye: '#ffffff' } } };
let me = null; try { me = localStorage.getItem('fp-me'); } catch (e) {}

async function load() {
  try { const r = await fetch('api/state'); if (r.ok) state = await r.json(); } catch (e) {}
  render();
}
async function save(patch) {
  try {
    const r = await fetch('api/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ who: me, ...patch }) });
    if (r.ok) state = await r.json();
  } catch (e) {}
  render();
}

function myOpt() { const p = me && state.people[me]; return p ? { blush: p.blush, eye: p.eye, style: p.style || 'retro' } : { blush: 'on', eye: '#ffffff', style: 'retro' }; }
let lastKey = '';

function render() {
  const key = JSON.stringify(state) + me; if (key === lastKey) return; lastKey = key;
  document.documentElement.style.setProperty('--me', me === 'Dr. Smith' ? 'var(--sm)' : 'var(--lo)');
  document.querySelectorAll('[data-who]').forEach(b => b.classList.toggle('on', b.dataset.who === me));
  const opt = myOpt();
  document.querySelectorAll('[data-blush]').forEach(b => b.classList.toggle('on', b.dataset.blush === opt.blush));
  document.querySelectorAll('[data-eye]').forEach(b => b.classList.toggle('on', b.dataset.eye === opt.eye));
  document.querySelectorAll('[data-style]').forEach(b => b.classList.toggle('on', b.dataset.style === opt.style));
  const lo = new Set(state.people['Lorenzo'].faces), sm = new Set(state.people['Dr. Smith'].faces);
  const grid = document.getElementById('grid');
  grid.innerHTML = FACES.map(f => {
    const L = lo.has(f.id), S = sm.has(f.id), mine = me && (me === 'Lorenzo' ? L : S);
    return `<div class="card ${mine?'mine':''} ${L&&S?'both':''}" data-face="${f.id}">
      <span class="badge">both ♥</span>
      <div class="screen">${opt.style === 'retro' ? `<canvas data-px="${f.id}" width="240" height="180"></canvas>` : faceSVG(f, opt)}</div>
      <div class="meta"><span class="name">${f.name}</span>
        <span class="dots">${L?'<span class="dot lo">L</span>':''}${S?'<span class="dot sm">S</span>':''}</span></div>
    </div>`;
  }).join('');
  const both = FACES.filter(f => lo.has(f.id) && sm.has(f.id)).map(f => f.name);
  const pL = state.people['Lorenzo'], pS = state.people['Dr. Smith'];
  document.getElementById('summary').innerHTML =
    `<b>Both picked (${both.length}):</b> ${both.join(', ') || '—'}<br>` +
    `Blush — Lorenzo: ${pL.blush}, Dr. Smith: ${pS.blush}`;
  if (opt.style === 'retro') paintRetro();
}

document.addEventListener('click', e => {
  const w = e.target.closest('[data-who]');
  if (w) { me = w.dataset.who; lastKey = ''; try { localStorage.setItem('fp-me', me); } catch (err) {} render(); return; }
  if (!me) { alert('Tap who you are first 🙂'); return; }
  const b = e.target.closest('[data-blush]'); if (b) return save({ blush: b.dataset.blush });
  const st = e.target.closest('[data-style]'); if (st) return save({ style: st.dataset.style });
  const c = e.target.closest('[data-eye]');   if (c) return save({ eye: c.dataset.eye });
  const card = e.target.closest('[data-face]'); if (card) return save({ toggle: card.dataset.face });
});

load();
setInterval(load, 1500);
</script>
</body>
</html>
